<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#24452D">
<script src="config.js"></script>
<title>Soilerr Organics – Batch Tracker</title>
<style>
:root{--bg:#FFFAF1;--card:#ffffff;--ink:#1c2a1c;--mut:#5f6d5f;--g:#24452D;--g2:#24452D;--gl:#e6efe3;--r:#c62828;--rl:#fde7e7;--y:#a85d00;--yl:#fff0d1;--bd:#e6e0cf;--sh:0 2px 8px rgba(36,69,45,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121812;--card:#1e271e;--ink:#eef3ee;--mut:#a3b0a3;--g:#66bb6a;--g2:#2e7d32;--gl:#243a25;--r:#ff8a80;--rl:#3d2020;--y:#ffc266;--yl:#3a2e14;--bd:#334033;--sh:none}}
:root[data-theme="dark"]{--bg:#121812;--card:#1e271e;--ink:#eef3ee;--mut:#a3b0a3;--g:#66bb6a;--g2:#2e7d32;--gl:#243a25;--r:#ff8a80;--rl:#3d2020;--y:#ffc266;--yl:#3a2e14;--bd:#334033;--sh:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{position:relative;background:#FFFAF1;padding:12px 14px 14px;border-bottom:3px solid #24452D}
.logo{display:block;height:42px;margin:0 0 8px}
.who{display:flex;gap:8px}.who select{flex:1;min-height:48px;border-radius:14px;border:2px solid #24452D;font-size:18px;font-weight:700;background:#fff;color:#1c2a1c}
.mini{min-width:52px;border:0;border-radius:14px;background:#24452D;color:#fffaf1;font-size:26px;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h2{font-size:21px;margin:8px 0}
h3{margin:0 0 4px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{min-height:112px;border:0;border-radius:20px;color:#fff;font-size:19px;font-weight:800;padding:10px;cursor:pointer;box-shadow:var(--sh);line-height:1.2}
.big span{display:block;font-size:38px;margin-bottom:4px}
.c1,.c5{background:#24452D}.c2,.c6{background:#2f5a3b}.c3{background:#3b6b49}.c4{background:#4a7c59}
.big{color:#fffaf1}.bn{font-size:22px;font-weight:900;letter-spacing:1px;color:var(--g);margin:6px 0 10px;word-break:break-all}
.btn{min-height:54px;border-radius:14px;border:2px solid var(--g);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;padding:8px 14px;cursor:pointer}
.btn.p{background:var(--g);color:#fff}.btn.full{width:100%}
.btn.sel{background:var(--g);color:#fff}.btn.bad.sel{background:var(--r);border-color:var(--r)}.btn.warn.sel{background:var(--y);border-color:var(--y);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1 1 100px}
.loc{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.loc .btn{flex:1 1 45%;font-size:16px}
label{display:block;font-weight:800;margin:14px 0 6px}
input,select{width:100%;min-height:54px;font-size:18px;padding:10px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--ink)}
.stats{display:flex;gap:8px;text-align:center}.stats div{flex:1;background:var(--gl);border-radius:14px;padding:10px 4px}.stats b{display:block;font-size:30px;color:var(--g)}.stats small{color:var(--mut)}
.tag{display:inline-block;border-radius:20px;padding:3px 12px;font-size:15px;font-weight:800}
.ok{background:var(--gl);color:var(--g)}.no{background:var(--rl);color:var(--r)}.mid{background:var(--yl);color:var(--y)}
.mut{color:var(--mut);font-size:15px}
.alert{background:var(--yl);color:var(--y);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:13px;font-weight:800;padding:8px 0;min-height:66px;cursor:pointer}
nav button b{display:block;font-size:26px;font-weight:400}nav button.on{color:var(--g)}
.drums{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.dr{min-height:64px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}
.dr.sel{background:var(--g);color:#fff;border-color:var(--g)}.dr.used{background:var(--gl)}
.item{border-bottom:1px solid var(--bd);padding:10px 0}.item:last-child{border:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bell{position:absolute;right:12px;top:8px;width:46px;height:46px;border-radius:50%;border:2px solid #24452D;background:#fff;font-size:26px;cursor:pointer}
.bell b{position:absolute;top:-8px;right:-6px;min-width:26px;height:26px;border-radius:13px;background:#c62828;color:#fff;font-size:15px;line-height:26px}
.seg{display:flex;gap:10px}.seg button{flex:1;min-height:56px;border-radius:16px;border:2px solid #24452D;background:#fff;color:#24452D;font-size:19px;font-weight:900;cursor:pointer}.seg button.on{background:#24452D;color:#fffaf1}
.pcard{background:#FFFAF1;color:#24452D;border:3px solid #24452D;border-radius:22px;padding:18px;margin-top:12px}
.pt{letter-spacing:3px;font-weight:800;font-size:13px;margin-top:10px}.pn{font-size:20px;font-weight:900;margin:6px 0;word-break:break-all}.pm{font-size:15px}
.pt2{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}.pt2 th{text-align:left;border-bottom:2px solid #24452D;padding:4px}.pt2 td{padding:5px 4px;border-bottom:1px solid #d8d2bd}
.ph{font-weight:900;margin:10px 0 4px}.tl{display:flex;gap:8px;align-items:center;padding:4px 0}.tl span:last-child{margin-left:auto}.dot{width:14px;height:14px;border-radius:50%;border:2px solid #24452D}.dot.on{background:#24452D}
.pf{text-align:center;margin-top:14px;font-weight:800;border-top:2px dashed #24452D;padding-top:10px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;padding:0}.wrap{max-width:none;padding:0}.pcard{break-inside:avoid}}@page{margin:10mm}
.hday{font-weight:800;margin:16px 0 4px;color:var(--mut);font-size:15px}.hrow{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer;align-items:flex-start}
.hic{min-width:38px;height:38px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:19px}
.plabel{width:70mm;background:#FFFAF1;color:#24452D;border:2px solid #24452D;border-radius:8px;padding:6px 8px;margin-top:12px}.pln{font-size:15px;font-weight:900;letter-spacing:.5px;margin-top:3px}
body.staff .adm{display:none}
</style>
</head>
