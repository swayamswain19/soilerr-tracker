<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soilerr Organics – Batch Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5a38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Soilerr Tracker">
<style>
:root{
  --bg:#f6f4ec;--surface:#fffdf8;--surface-2:#f1f4ed;--ink:#17301f;--mut:#66736a;
  --brand:#1f5a38;--brand-2:#2f754a;--brand-3:#dfeee1;--gold:#b67a24;
  --danger:#b42318;--danger-bg:#fde9e7;--warn:#9a6500;--warn-bg:#fff3d6;
  --line:#dfe5dc;--shadow:0 8px 30px rgba(23,48,31,.07);--shadow-lg:0 16px 50px rgba(23,48,31,.11);
  --radius:20px;--radius-sm:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101713;--surface:#18221b;--surface-2:#203024;--ink:#edf5ee;--mut:#aab7ad;--brand:#72bd83;--brand-2:#4d9a61;--brand-3:#24402a;--gold:#e1b35f;--danger:#ff8c83;--danger-bg:#3b211f;--warn:#f1c76e;--warn-bg:#3a301a;--line:#304036;--shadow:none;--shadow-lg:none}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{
  margin:0;background:
  radial-gradient(circle at 15% -10%,rgba(47,117,74,.10),transparent 30%),
  radial-gradient(circle at 100% 10%,rgba(182,122,36,.08),transparent 26%),
  var(--bg);color:var(--ink);
  font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:104px;-webkit-font-smoothing:antialiased
}
button,input,select{font:inherit}
button{touch-action:manipulation}
header{
  position:sticky;top:0;z-index:20;background:rgba(255,253,248,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:14px max(16px,calc((100vw - 760px)/2)) 12px;border-bottom:1px solid var(--line);
}
.logo{display:block;width:auto;height:48px;max-width:230px;margin:0 auto 8px;object-fit:contain}
header:after{content:"Quality • Traceability • Transparency";display:block;text-align:center;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.who{display:flex;gap:8px;max-width:760px;margin:12px auto 0}.who select{flex:1;min-height:46px;border-radius:13px;border:1px solid var(--line);font-size:15px;font-weight:700;background:var(--surface);color:var(--ink);padding:8px 12px}
.mini{min-width:46px;border:0;border-radius:13px;background:var(--brand);color:#fff;font-size:22px;font-weight:800;box-shadow:0 5px 14px rgba(31,90,56,.18)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 28px}
h2{font-size:24px;line-height:1.2;margin:8px 0 14px;letter-spacing:-.025em}h3{margin:0 0 5px;font-size:17px;line-height:1.25}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px;margin:14px 0;box-shadow:var(--shadow)
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{
  min-height:132px;border:1px solid transparent;border-radius:22px;color:#fff;font-size:16px;font-weight:800;
  padding:16px;cursor:pointer;box-shadow:var(--shadow);line-height:1.25;text-align:left;
  display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;
  transition:transform .16s ease,box-shadow .16s ease
}
.big:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.big span{display:block;font-size:32px;margin-bottom:auto}.c1,.c5{background:linear-gradient(145deg,#194d30,#2f754a)}
.c2,.c6{background:linear-gradient(145deg,#275f3b,#47885a)}.c3{background:linear-gradient(145deg,#316d47,#5a9a68)}.c4{background:linear-gradient(145deg,#8b6426,#b9822e)}
.big{color:#fff}.bn{font-size:30px;font-weight:900;letter-spacing:.5px;color:var(--brand);margin:8px 0 12px;word-break:break-all}
.btn{
  min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:15px;font-weight:750;padding:9px 14px;cursor:pointer;transition:.15s ease
}
.btn:hover{border-color:var(--brand-2);transform:translateY(-1px)}.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 5px 15px rgba(31,90,56,.16)}
.btn.full{width:100%}.btn.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.bad.sel{background:var(--danger);border-color:var(--danger)}.btn.warn.sel{background:var(--gold);border-color:var(--gold);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1 1 100px}
.loc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}.loc .btn{font-size:13px;min-height:54px;padding:7px 8px}
label{display:block;font-weight:800;font-size:14px;margin:15px 0 6px;color:var(--ink)}
input,select{width:100%;min-height:48px;font-size:16px;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,117,74,.10)}
.stats{display:flex;gap:9px;text-align:center}.stats div{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px 5px}.stats b{display:block;font-size:27px;color:var(--brand);letter-spacing:-.03em}.stats small{color:var(--mut);font-size:12px;font-weight:650}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:850;letter-spacing:.01em}.ok{background:var(--brand-3);color:var(--brand)}.no{background:var(--danger-bg);color:var(--danger)}.mid{background:var(--warn-bg);color:var(--warn)}
.mut{color:var(--mut);font-size:13px}.alert{background:var(--warn-bg);color:var(--warn);font-weight:750;border-color:#ecd59f}
nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(728px,calc(100% - 24px));z-index:30;
  background:rgba(255,253,248,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:20px;display:flex;padding:5px;box-shadow:0 12px 35px rgba(23,48,31,.13)
}
nav button{flex:1;border:0;border-radius:15px;background:none;color:var(--mut);font-size:11px;font-weight:800;padding:6px 0;min-height:62px;cursor:pointer}
nav button b{display:block;font-size:23px;font-weight:400;margin-bottom:2px}nav button.on{color:var(--brand);background:var(--brand-3)}
.drums{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.dr{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:800;cursor:pointer}
.dr.sel{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(31,90,56,.15)}.dr.used{background:var(--brand-3)}
.item{border-bottom:1px solid var(--line);padding:12px 0}.item:last-child{border:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:560px){.grid{gap:9px}.big{min-height:118px;padding:14px}.loc{grid-template-columns:1fr}.wrap{padding:15px 13px 25px}h2{font-size:22px}}
@media(min-width:760px){header .who{padding-left:16px;padding-right:16px}}

/* Responsive + touch improvements */
@media (max-width:640px){
  body{font-size:15px;padding-bottom:100px}
  header{padding-left:12px;padding-right:12px}
  .logo{height:42px;max-width:190px}
  .wrap{padding:14px 12px 24px}
  h2{font-size:22px}
  .card{padding:14px;border-radius:17px;margin:11px 0}
  .grid{grid-template-columns:1fr 1fr;gap:9px}
  .big{min-height:118px;padding:13px;border-radius:18px;font-size:15px}
  .big span{font-size:28px}
  .stats{gap:6px}.stats div{padding:10px 3px}.stats b{font-size:24px}
  .loc{grid-template-columns:1fr;gap:7px}
  .loc .btn{min-height:48px;text-align:left;padding-left:12px}
  .drums{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .dr{min-height:58px;font-size:13px}
  .row .btn{flex:1 1 calc(50% - 8px);min-width:0}
  .bn{font-size:24px}
  nav{bottom:7px;width:calc(100% - 14px);border-radius:17px}
  nav button{min-height:58px;font-size:10px}
  nav button b{font-size:21px}
}
@media (max-width:380px){
  .grid{grid-template-columns:1fr}
  .big{min-height:92px}
  .drums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats small{font-size:10px}
}
@media (min-width:900px){
  .wrap{max-width:900px;padding-left:24px;padding-right:24px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .big{min-height:145px}
  .loc{grid-template-columns:repeat(3,1fr)}
}
@media (hover:none){.btn:hover,.big:hover{transform:none;box-shadow:var(--shadow)}}
.offline-pill{display:flex;align-items:center;justify-content:center;gap:7px;margin:8px auto 0;width:max-content;max-width:100%;padding:5px 10px;border-radius:999px;background:var(--brand-3);color:var(--brand);font-size:11px;font-weight:800}
.offline-pill.off{background:var(--warn-bg);color:var(--warn)}
.install-btn{display:none;margin:8px auto 0;border:1px solid var(--brand);background:var(--surface);color:var(--brand);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer}
.install-btn.show{display:block}

</style>
</head>

<div id="pwa-status" class="offline-pill"><span>●</span><span id="network-text">Ready for offline use</span></div>
<button id="install-btn" class="install-btn">＋ Install Soilerr Tracker</button>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<script>
var KEY='soilerr_v1',LOCS=['Home Backyard','Hiradi Plant One','Hiradi Plant Two'],OFF=['Hiradi Plant Two'],CODE={'Home Backyard':'HB','Hiradi Plant One':'H1','Hiradi Plant Two':'H2'},SRC=['Nimpura','Jai Hind Nagar','Other'];
var S={loc:LOCS[0],who:'',staff:[],drums:[],intake:[],batches:[],checks:[],reads:[]};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
var V='home',sel=[],bid=null,form={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function age(d){return Math.max(0,Math.floor((Date.now()-new Date(d))/864e5))}
function go(v,b){V=v;bid=b||null;sel=[];form={};render();window.scrollTo(0,0)}
function setLoc(l){S.loc=l;save();render()}
function setWho(v){S.who=v;save();render()}
function addStaff(){var n=(prompt('Type staff name')||'').trim();if(!n)return;if(S.staff.indexOf(n)<0)S.staff.push(n);S.who=n;save();render()}
function need(){return true}
function locBar(){return '<div class="loc">'+LOCS.map(function(l){if(OFF.indexOf(l)>=0)return '<button class="btn" disabled style="opacity:.5">📍 '+l+'<br><small>Not working yet</small></button>';return '<button class="btn'+(S.loc==l?' p':'')+'" onclick="setLoc(\''+l+'\')">📍 '+l+'</button>'}).join('')+'</div>'}
function batchOf(id){return S.batches.find(function(b){return b.id==id})}
function lastOf(arr,id){var c=arr.filter(function(x){return x.batch==id});return c[c.length-1]}
function flag(c){if(!c)return['mid','No check yet'];var bad=c.smell=='Bad'||c.worms=='None'||c.moist=='Too wet'||c.heat=='Hot';var w=c.moist=='Too dry'||c.worms=='Few'||c.heat=='Warm';return bad?['no','Needs attention']:w?['mid','Watch']:['ok','All good']}
function srcSel(id){return '<select id="'+id+'">'+SRC.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select>'}
function dateIn(id){return '<label>📅 Date</label><input id="'+id+'" type="date" value="'+today()+'">'}
function render(){
 var t=[['home','🏠','Home'],['intake','📥','Material'],['batches','📦','Batches'],['drums','🛢️','Drums']];
 document.getElementById('nav').innerHTML=t.map(function(x){return '<button class="'+(V==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>'}).join('');
 document.getElementById('app').innerHTML=({home:home,intake:intake,batches:batches,drums:drums,newbatch:newbatch,batch:batchView,check:checkForm,read:readForm,month:monthView})[V]()}

function home(){
 var d=S.drums.filter(function(x){return x.loc==S.loc}),t=today();
 var kg=S.intake.filter(function(x){return x.date==t&&x.loc==S.loc&&x.mat=='Cow dung'}).reduce(function(s,x){return s+x.kg},0);
 var ab=S.batches.filter(function(b){return b.loc==S.loc&&b.stage!='Done'});
 var need7=ab.filter(function(b){var r=lastOf(S.reads,b.id);return !r||age(r.date)>=7}).length;
 var bad=ab.filter(function(b){return flag(lastOf(S.checks,b.id))[0]=='no'}).length;
 return locBar()+'<div class="card stats"><div><b>'+d.length+'</b><small>Drums</small></div><div><b>'+ab.length+'</b><small>Batches</small></div><div><b>'+kg+'</b><small>kg dung today</small></div></div>'+
 (bad?'<div class="card" style="background:var(--rl);color:var(--r);font-weight:800">⚠️ '+bad+' batch needs attention</div>':'')+
 (need7?'<div class="card alert">📏 '+need7+' batch needs weekly moisture / pH reading</div>':'')+
 (S.drums.length?'':'<div class="card">👉 First: open <b>Drums</b> and add your drums.</div>')+
 '<div class="grid"><button class="big c1" onclick="go(\'intake\')"><span>📥</span>Material came in</button><button class="big c2" onclick="go(\'newbatch\')"><span>🆕</span>Make new batch</button><button class="big c3" onclick="go(\'check\')"><span>✅</span>Daily check</button><button class="big c4" onclick="go(\'read\')"><span>📏</span>Weekly moisture & pH</button><button class="big c5" onclick="go(\'drums\')"><span>🔁</span>Move drums</button><button class="big c6" onclick="go(\'month\')"><span>📊</span>Monthly material</button></div>'}

function intake(){
 var rows=S.intake.filter(function(x){return x.loc==S.loc}).slice(-15).reverse();
 return '<h2>📥 Material came in</h2>'+locBar()+
 '<div class="card">'+dateIn('dt')+'<label>What came?</label><select id="mat"><option>Cow dung</option><option>Dry leaves / straw</option><option>Earthworms</option><option>Other</option></select>'+
 '<label>How many kg?</label><input id="kg" type="number" inputmode="decimal" placeholder="e.g. 120">'+
 '<label>🚚 From where?</label>'+srcSel('src')+'<label>Note (optional)</label><input id="nt"><br><br><button class="btn p full" onclick="addIntake()">✔ Save</button></div>'+
 '<h2>Recent</h2><div class="card">'+(rows.length?rows.map(function(x){return '<div class="item"><b>'+esc(x.mat)+' – '+x.kg+' kg</b><div class="mut">'+x.date+' · from '+esc(x.src)+(x.nt?' · '+esc(x.nt):'')+'</div></div>'}).join(''):'<span class="mut">Nothing saved yet</span>')+'</div>'}
function addIntake(){if(!need())return;var kg=parseFloat(document.getElementById('kg').value);if(!(kg>0)){alert('Please type how many kg');return}
 S.intake.push({id:uid(),date:document.getElementById('dt').value||today(),loc:S.loc,mat:document.getElementById('mat').value,kg:kg,src:document.getElementById('src').value,nt:document.getElementById('nt').value,by:S.who});save();render()}

function drums(){
 var d=S.drums.filter(function(x){return x.loc==S.loc}),other=LOCS.filter(function(l){return l!=S.loc&&OFF.indexOf(l)<0})[0];
 return '<h2>🛢️ Drums</h2>'+locBar()+
 '<div class="card"><h3>'+d.length+' drums here</h3><div class="mut">Tap drums, then move them to '+other+'</div><br><div class="drums">'+d.map(function(x){return '<button class="dr'+(sel.indexOf(x.id)>=0?' sel':x.batch?' used':'')+'" onclick="tog(\''+x.id+'\')">'+x.name+(x.batch?'<br><small>in batch</small>':'')+'</button>'}).join('')+'</div>'+
 (sel.length?'<br><button class="btn p full" onclick="moveDrums()">➡️ Move '+sel.length+' to '+other+'</button>':'')+'</div>'+
 '<div class="card"><label>➕ Add new drums here</label><input id="nd" type="number" inputmode="numeric" placeholder="How many? e.g. 40"><br><br><button class="btn full" onclick="addDrums()">Add drums</button></div>'}
function tog(id){var i=sel.indexOf(id);if(i>=0)sel.splice(i,1);else sel.push(id);var y=window.scrollY;render();window.scrollTo(0,y)}
function addDrums(){if(!need())return;var n=parseInt(document.getElementById('nd').value);if(!(n>0&&n<=200)){alert('Type a number');return}
 var c=CODE[S.loc],m=S.drums.filter(function(x){return x.name.indexOf(c+'-')==0}).length;
 for(var i=1;i<=n;i++){S.drums.push({id:uid()+i,name:c+'-'+String(m+i).padStart(2,'0'),loc:S.loc,batch:null})}save();render()}
function moveDrums(){if(!need())return;var other=LOCS.filter(function(l){return l!=S.loc&&OFF.indexOf(l)<0})[0];if(!confirm('Move '+sel.length+' drums to '+other+'?'))return;
 S.drums.forEach(function(x){if(sel.indexOf(x.id)>=0)x.loc=other});sel=[];save();render()}

function newbatch(){
 var free=S.drums.filter(function(x){return x.loc==S.loc&&!x.batch});
 return '<h2>🆕 Make new batch</h2>'+locBar()+
 '<div class="card"><h3>1. Tap the drums</h3><br>'+(free.length?'<div class="drums">'+free.map(function(x){return '<button class="dr'+(sel.indexOf(x.id)>=0?' sel':'')+'" onclick="tog(\''+x.id+'\')">'+x.name+'</button>'}).join('')+'</div>':'<span class="mut">No empty drums here. Add drums first.</span>')+
 '<label>2. Cow dung in each drum (kg)</label><input id="dk" type="number" inputmode="decimal" value="120">'+
 '<label>3. 🚚 Dung is from</label>'+srcSel('ds')+dateIn('bd')+
 '<label>Note (optional)</label><input id="bn"><br><br><button class="btn p full" onclick="mkBatch()">Create batch ('+sel.length+' drums)</button></div>'}
function mkBatch(){if(!need())return;if(!sel.length){alert('Tap at least one drum');return}
 var c=CODE[S.loc],dt=document.getElementById('bd').value||today(),ds=dt.replace(/-/g,'').slice(2),n=S.batches.filter(function(b){return b.id.indexOf('SO-'+c+'-'+ds)==0}).length+1;
 var b={id:mkId(c,ds,n),loc:S.loc,start:dt,drums:sel.slice(),kg:parseFloat(document.getElementById('dk').value)||120,src:document.getElementById('ds').value,nt:document.getElementById('bn').value,stage:'Filled',by:S.who};
 S.batches.push(b);S.drums.forEach(function(x){if(sel.indexOf(x.id)>=0)x.batch=b.id});save();go('batch',b.id)}

function monthView(){
 var m=form.m||today().slice(0,7),it=S.intake.filter(function(x){return x.loc==S.loc&&x.date.slice(0,7)==m});
 function grp(k){var o={};it.forEach(function(x){o[x[k]]=(o[x[k]]||0)+x.kg});return o}
 function rows(o,s){var k=Object.keys(o);if(s)k.sort().reverse();return k.length?k.map(function(n){return '<div class="item top"><b>'+esc(n)+'</b><b>'+o[n]+' kg</b></div>'}).join(''):'<span class="mut">Nothing this month</span>'}
 var tot=it.reduce(function(s,x){return s+x.kg},0),dung=grp('mat')['Cow dung']||0,used=S.batches.filter(function(b){return b.loc==S.loc&&b.start.slice(0,7)==m}).reduce(function(s,b){return s+b.drums.length*b.kg},0);
 return '<h2>📊 Monthly material</h2>'+locBar()+'<div class="card"><label>Month</label><input type="month" value="'+m+'" onchange="form.m=this.value||form.m;render()"><div class="stats" style="margin-top:12px"><div><b>'+tot+'</b><small>kg came in</small></div><div><b>'+it.length+'</b><small>entries</small></div></div></div>'+
 '<div class="card"><h3>🐄 Cow dung</h3><div class="item top"><span>Came in</span><b>'+dung+' kg</b></div><div class="item top"><span>Put in new batches</span><b>'+used+' kg</b></div><div class="item top"><span>Difference</span><b>'+(dung-used)+' kg</b></div></div>'+
 '<h2>By material</h2><div class="card">'+rows(grp('mat'))+'</div><h2>By place</h2><div class="card">'+rows(grp('src'))+'</div><h2>Day by day</h2><div class="card">'+rows(grp('date'),1)+'</div>'}
function mkId(c,ds,n){var id;do{id='SO-'+c+'-'+ds+'-'+String(n++).padStart(2,'0')}while(batchOf(id));return id}
function cp(id){try{navigator.clipboard.writeText(id).then(function(){alert('Copied: '+id)},function(){prompt('Copy this number',id)})}catch(e){prompt('Copy this number',id)}}
function batches(){
 var l=S.batches.filter(function(b){return b.loc==S.loc}).slice().reverse();
 return '<h2>📦 Batches</h2>'+locBar()+'<button class="btn p full" onclick="go(\'newbatch\')">🆕 Make new batch</button>'+
 (l.length?l.map(function(b){var f=flag(lastOf(S.checks,b.id));return '<div class="card" onclick="go(\'batch\',\''+b.id+'\')" style="cursor:pointer"><div class="top"><h3>'+b.id+'</h3><span class="tag '+f[0]+'">'+f[1]+'</span></div><div class="mut">'+b.drums.length+' drums · day '+age(b.start)+' · '+b.stage+'</div></div>'}).join(''):'<div class="card mut">No batches here yet</div>')}

var STAGES=['Filled','Worms added','Growing','Ready to harvest','Done'];
function batchView(){
 var b=batchOf(bid);if(!b)return batches();var cs=S.checks.filter(function(x){return x.batch==b.id}).reverse(),rs=S.reads.filter(function(x){return x.batch==b.id}).reverse(),f=flag(cs[0]);
 return '<button class="btn" onclick="go(\'batches\')">← Back</button><div class="card" style="text-align:center;margin-top:12px"><div class="mut">BATCH NUMBER – write on packaging</div><div class="bn">'+b.id+'</div><button class="btn" onclick="cp(\''+b.id+'\')">📋 Copy number</button></div>'+
 '<div class="card"><span class="tag '+f[0]+'">'+f[1]+'</span><p>📍 '+b.loc+'<br>📅 Started '+b.start+' (day '+age(b.start)+')<br>🛢️ '+b.drums.length+' drums × '+b.kg+' kg = <b>'+(b.drums.length*b.kg)+' kg cow dung</b><br>🚚 From '+esc(b.src)+(b.nt?'<br>📝 '+esc(b.nt):'')+'</p>'+
 (rs[0]?'<div class="stats"><div><b>'+rs[0].moist+'%</b><small>Moisture</small></div><div><b>'+rs[0].ph+'</b><small>pH</small></div></div><br>':'')+
 '<b>Batch journey</b><div class="row" style="margin-top:8px">'+STAGES.map(function(s,i){var active=STAGES.indexOf(b.stage)>=i;return '<button class="btn'+(active?' sel':'')+'" onclick="setStage(\''+b.id+'\',\''+s+'\')">'+(active?'✓ ':'')+s+'</button>'}).join('')+'</div></div>'+
 '<div class="grid"><button class="big c3" onclick="go(\'check\');form.b=\''+b.id+'\';render()"><span>✓</span>Daily check</button><button class="big c4" onclick="go(\'read\');form.b=\''+b.id+'\';render()"><span>⌁</span>Moisture & pH</button></div><div class="card" style="background:var(--brand-3);border-color:transparent;margin-top:12px"><b>Customer transparency</b><div class="mut" style="margin-top:4px">Share this batch summary so customers can see where it started, what stage it is in, and the latest quality readings.</div><br><button class="btn p full" onclick="share(\''+b.id+'\')">Share batch report</button></div>'+
 '<h2>Weekly moisture & pH</h2><div class="card">'+(rs.length?rs.map(function(r){return '<div class="item"><b>'+r.date+'</b> · Moisture '+r.moist+'% · pH '+r.ph+'</div>'}).join(''):'<span class="mut">No readings yet</span>')+'</div>'+
 '<h2>Daily checks</h2><div class="card">'+(cs.length?cs.slice(0,20).map(function(c){var g=flag(c);return '<div class="item"><span class="tag '+g[0]+'">'+g[1]+'</span> <b>'+c.date+'</b><div class="mut">Smell '+c.smell+' · '+c.moist+' · Worms '+c.worms+' · '+c.heat+(c.nt?'<br>'+esc(c.nt):'')+'</div></div>'}).join(''):'<span class="mut">No checks yet</span>')+'</div>'}
function setStage(id,s){if(!need())return;batchOf(id).stage=s;if(s=='Done')S.drums.forEach(function(x){if(x.batch==id)x.batch=null});save();render()}
function share(id){var b=batchOf(id),cs=S.checks.filter(function(x){return x.batch==id}),ok=cs.filter(function(c){return flag(c)[0]=='ok'}).length,r=lastOf(S.reads,id);
 var t='🌱 Soilerr Organics – Batch '+b.id+'\nLocation: '+b.loc+'\nStarted: '+b.start+'\nCow dung: '+(b.drums.length*b.kg)+' kg from '+b.src+'\nStage: '+b.stage+'\nQuality checks: '+cs.length+' ('+ok+' all good)'+(r?'\nMoisture '+r.moist+'% · pH '+r.ph+' ('+r.date+')':'');
 if(navigator.share){navigator.share({text:t}).catch(function(){})}else{window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}}

function pickBatch(){var act=S.batches.filter(function(b){return b.loc==S.loc&&b.stage!='Done'});if(!form.b&&act.length)form.b=act[0].id;
 return act.length?'<label>Which batch?</label><select onchange="form.b=this.value">'+act.map(function(b){return '<option value="'+b.id+'"'+(form.b==b.id?' selected':'')+'>'+b.id+'</option>'}).join('')+'</select>':null}
function checkForm(){
 var pb=pickBatch(),ch=function(k,lab,opts){return '<label>'+lab+'</label><div class="row">'+opts.map(function(o){return '<button class="btn'+(o[2]?' '+o[2]:'')+(form[k]==o[0]?' sel':'')+'" onclick="form.'+k+'=\''+o[0]+'\';keep()">'+o[1]+'</button>'}).join('')+'</div>'};
 return '<h2>✅ Daily check</h2>'+locBar()+(pb?'<div class="card">'+pb+dateIn('cd')+
 ch('smell','👃 Smell',[['Good','😊 Good'],['Bad','🤢 Bad','bad']])+
 ch('moist','💧 Wetness',[['Too dry','Too dry','warn'],['Just right','Just right'],['Too wet','Too wet','bad']])+
 ch('worms','🪱 Worms',[['Many','Many'],['Few','Few','warn'],['None','None','bad']])+
 ch('heat','🌡️ Heat (touch it)',[['Cool','Cool'],['Warm','Warm','warn'],['Hot','Hot','bad']])+
 '<label>Note (optional)</label><input id="cn"><br><br><button class="btn p full" onclick="addCheck()">✔ Save check</button></div>':'<div class="card">No active batch here. Make a batch first.</div>')}
function keep(){var n=document.getElementById('cn'),d=document.getElementById('cd'),v=n?n.value:'',dv=d?d.value:'',y=window.scrollY;render();n=document.getElementById('cn');d=document.getElementById('cd');if(n)n.value=v;if(d&&dv)d.value=dv;window.scrollTo(0,y)}
function addCheck(){if(!need())return;if(!(form.smell&&form.moist&&form.worms&&form.heat)){alert('Please tap all 4 answers');return}
 S.checks.push({id:uid(),batch:form.b,date:document.getElementById('cd').value||today(),smell:form.smell,moist:form.moist,worms:form.worms,heat:form.heat,nt:document.getElementById('cn').value,by:S.who});save();go('batch',form.b)}

function readForm(){var pb=pickBatch();
 return '<h2>📏 Weekly moisture & pH</h2>'+locBar()+(pb?'<div class="card">'+pb+dateIn('rd')+
 '<label>💧 Moisture (%)</label><input id="rm" type="number" inputmode="decimal" placeholder="e.g. 70">'+
 '<label>🧪 pH (0 to 14)</label><input id="rp" type="number" inputmode="decimal" step="0.1" placeholder="e.g. 7.2"><br><br><button class="btn p full" onclick="addRead()">✔ Save reading</button></div>':'<div class="card">No active batch here. Make a batch first.</div>')}
function addRead(){if(!need())return;var m=parseFloat(document.getElementById('rm').value),p=parseFloat(document.getElementById('rp').value);
 if(!(m>=0&&m<=100)){alert('Moisture must be between 0 and 100');return}if(!(p>=0&&p<=14)){alert('pH must be between 0 and 14');return}
 S.reads.push({id:uid(),batch:form.b,date:document.getElementById('rd').value||today(),moist:m,ph:p,by:S.who});save();go('batch',form.b)}
render();


/* PWA / offline shell */
(function(){
  var pill=document.getElementById('pwa-status'), txt=document.getElementById('network-text'), ib=document.getElementById('install-btn');
  function net(){
    var on=navigator.onLine;
    pill.classList.toggle('off',!on);
    txt.textContent=on?'Online • data saved on this device':'Offline • working from this device';
  }
  window.addEventListener('online',net); window.addEventListener('offline',net); net();
  var deferred;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;ib.classList.add('show');});
  ib.addEventListener('click',function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;ib.classList.remove('show')});});
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();
</script>
